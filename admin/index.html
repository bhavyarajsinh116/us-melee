<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Melee Diamonds | Enterprise Admin System</title>
    <link rel="icon" href="../images/logo/melee-logo.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../js/adminDataStore.js"></script>
    <script src="../js/stockData.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Cinzel:wght@600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .font-heading { font-family: 'Cinzel', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 999px; }
        .gd-gold-text { color: #d4af37; }
        .gd-gold-bg { background-color: #d4af37; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50">
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[9999] space-y-2 pointer-events-none"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="admin-root" class="min-h-screen flex flex-col">
        <!-- Rendered dynamically by admin script below -->
    </div>

    <script>
        (function () {
            'use strict';

            const STORE = window.GuruAdminStore;
            window.STORE = STORE;

            window.exportCSV = function (colName) {
                if (window.GuruAdminStore && typeof window.GuruAdminStore.exportCSV === 'function') {
                    window.GuruAdminStore.exportCSV(colName);
                } else if (STORE && typeof STORE.exportCSV === 'function') {
                    STORE.exportCSV(colName);
                } else {
                    alert('Data store is initializing. Please try again.');
                }
            };

            // Auth State
            function isAdminLoggedIn() {
                return localStorage.getItem('gd_admin_session') === 'active';
            }

            function setAdminSession(active) {
                if (active) localStorage.setItem('gd_admin_session', 'active');
                else localStorage.removeItem('gd_admin_session');
                renderApp();
            }

            function showToast(msg, isError = false) {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `p-3 px-5 rounded-xl text-xs font-bold text-white shadow-2xl flex items-center gap-2 transition-all duration-300 transform translate-y-0 ${
                    isError ? 'bg-rose-600' : 'bg-slate-900 border border-amber-500/40 text-amber-300'
                }`;
                toast.innerHTML = `<span>${isError ? '⚠️' : '✨'}</span> <span>${msg}</span>`;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
            window.showToast = showToast;

            let activeTab = 'overview';
            let searchQuery = '';
            let statusFilter = 'All';

            function renderApp() {
                const root = document.getElementById('admin-root');
                if (!root) return;

                if (!isAdminLoggedIn()) {
                    root.innerHTML = renderLoginScreen();
                    return;
                }

                root.innerHTML = `
                    <!-- Top Header -->
                    <header class="bg-[#0F172A] border-b border-amber-500/40 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-xl">
                        <div class="flex items-center gap-4">
                            <a href="../index.html" class="flex items-center gap-2">
                                <img src="../images/logo/melee-logo-transparent.png" alt="Melee Diamonds" class="h-10 w-auto">
                            </a>
                            <div class="h-7 w-px bg-slate-700"></div>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h1 class="text-xl font-serif font-extrabold text-white tracking-wider">
                                        MELEE <span class="text-[#D4AF37]">DIAMONDS</span>
                                    </h1>
                                    <span class="bg-amber-400/10 text-amber-300 border border-amber-400/40 text-[10px] font-mono font-extrabold px-2.5 py-0.5 rounded-full uppercase tracking-widest">
                                        Enterprise Control Desk
                                    </span>
                                </div>
                                <p class="text-[11px] text-slate-300 font-light tracking-wide">US B2B Wholesale Operations · Customer Pricing Tiers · Live Stock & Inquiry Engine</p>
                            </div>
                        </div>

                        <div class="flex items-center gap-4">
                            <a href="../stock.html" target="_blank" class="text-xs font-bold text-slate-200 hover:text-white transition flex items-center gap-1.5 bg-slate-800/90 px-3.5 py-2 rounded-xl border border-slate-700 shadow-md">
                                <span>📄 View Stock Sheets</span>
                            </a>
                            <a href="../index.html" target="_blank" class="text-xs font-bold text-amber-300 hover:text-amber-200 transition flex items-center gap-1.5 bg-slate-800/90 px-4 py-2 rounded-xl border border-amber-500/30 hover:border-amber-400 shadow-md">
                                <span>🌐 View Website Live &rarr;</span>
                            </a>
                            <button onclick="handleAdminLogout()" class="px-4 py-2 bg-rose-950/90 hover:bg-rose-900 border border-rose-800/80 text-rose-200 text-xs font-bold rounded-xl transition cursor-pointer shadow-md">
                                Logout
                            </button>
                        </div>
                    </header>

                    <!-- Navigation Bar Tabs -->
                    <nav class="bg-[#0F172A] border-b border-slate-800 px-6 py-2.5 flex items-center gap-1.5 overflow-x-auto custom-scrollbar shadow-inner">
                        ${renderNavTabs()}
                    </nav>

                    <!-- Main Content Area -->
                    <main class="flex-1 p-6 max-w-7xl mx-auto w-full custom-scrollbar">
                        ${renderTabContent()}
                    </main>

                    <!-- Footer -->
                    <footer class="bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500 font-medium">
                        <div>&copy; 2026 Melee Diamonds. US: 45 West 47th Street, 500, New York NY 10036, United States | Tel: (646)-565-4211 | Email: info@meleediamondinc.com</div>
                    </footer>
                `;
            }

            function renderLoginScreen() {
                return `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-[#0F172A]">
                        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6 border border-amber-500/40">
                            <div class="text-center space-y-2">
                                <img src="../images/logo/melee-logo-transparent.png" alt="Melee Diamonds" class="h-12 w-auto mx-auto mb-2">
                                <h2 class="text-2xl font-serif font-extrabold text-[#0F172A]">MELEE <span class="text-[#D4AF37]">DIAMONDS</span></h2>
                                <p class="text-xs text-slate-500 font-bold uppercase tracking-widest">Enterprise Admin Control Portal</p>
                            </div>

                            <form onsubmit="handleAdminLogin(event)" class="space-y-4 text-xs">
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">Admin Username / Email</label>
                                    <input type="text" id="admin-user" required placeholder="Enter Admin Username or Email" value="" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 font-semibold outline-none focus:border-[#D4AF37] focus:bg-white">
                                </div>
                                <div>
                                    <label class="block font-bold text-slate-700 mb-1">Password</label>
                                    <input type="password" id="admin-pass" required placeholder="Enter Admin Password" value="" class="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 font-semibold outline-none focus:border-[#D4AF37] focus:bg-white">
                                </div>
                                <button type="submit" class="w-full py-3 bg-[#0F172A] hover:bg-[#1E293B] text-[#D4AF37] font-black text-sm rounded-xl shadow-lg transition cursor-pointer border border-[#D4AF37]/50">
                                    Unlock Enterprise Admin System &rarr;
                                </button>
                            </form>
                            <div class="text-center text-[11px] text-slate-400 font-medium">
                                Protected System · Authenticated Melee Diamonds Portal
                            </div>
                        </div>
                    </div>
                `;
            }

            function renderNavTabs() {
                const appointments = STORE.getCollection('appointments');
                const inquiries = STORE.getCollection('inquiries');
                const customOrders = STORE.getCollection('customOrders');
                const apps = STORE.getCollection('customerApplications');
                const pendingApts = appointments.filter(a => a.status === 'Pending').length;
                const pendingInqs = inquiries.filter(i => i.status === 'New').length;
                const pendingCads = customOrders.filter(c => c.status === 'New').length;
                const pendingApps = apps.filter(a => a.status === 'Pending Approval').length;

                const tabs = [
                    { id: 'overview', label: 'Dashboard', icon: '📊' },
                    { id: 'appointments', label: `Appointments (${appointments.length})`, icon: '📅', badge: pendingApts },
                    { id: 'inquiries', label: `Inquiries (${inquiries.length})`, icon: '✉️', badge: pendingInqs },
                    { id: 'customOrders', label: `Custom CAD (${customOrders.length})`, icon: '💍', badge: pendingCads },
                    { id: 'registrations', label: `Approvals (${apps.length})`, icon: '👤', badge: pendingApps },
                    { id: 'customers', label: 'Customers', icon: '👥' },
                    { id: 'groups', label: 'Discount Tiers', icon: '🏷️' },
                    { id: 'priceAccess', label: 'Price Access Logs', icon: '🔑' },
                    { id: 'inventory', label: 'Inventory Stock', icon: '💎' },
                    { id: 'pricing', label: 'Pricing Rules', icon: '💲' },
                    { id: 'orders', label: 'Orders', icon: '🛍️' },
                    { id: 'stockSheets', label: 'Stock Sheets Manager', icon: '📄' },
                    { id: 'reports', label: 'Reports & CSV', icon: '📑' },
                    { id: 'audit', label: 'Audit Logs', icon: '📜' }
                ];

                return tabs.map(t => {
                    const isActive = activeTab === t.id;
                    return `
                        <button onclick="switchTab('${t.id}')" class="flex items-center gap-1.5 px-3.5 py-2 text-xs font-bold rounded-xl transition shrink-0 cursor-pointer ${
                            isActive ? 'bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 font-black shadow-lg border border-amber-300' : 'text-slate-300 hover:bg-slate-800/80 hover:text-white border border-transparent'
                        }">
                            <span>${t.icon}</span>
                            <span>${t.label}</span>
                            ${t.badge > 0 ? `<span class="text-[10px] px-1.5 py-0.2 rounded-full font-black ${isActive ? 'bg-slate-950 text-amber-300' : 'bg-rose-500 text-white'}">${t.badge}</span>` : ''}
                        </button>
                    `;
                }).join('');
            }

            function renderTabContent() {
                switch (activeTab) {
                    case 'overview': return renderOverviewTab();
                    case 'appointments': return renderAppointmentsTab();
                    case 'inquiries': return renderInquiriesTab();
                    case 'customOrders': return renderCustomOrdersTab();
                    case 'registrations': return renderRegistrationsTab();
                    case 'customers': return renderCustomersTab();
                    case 'groups': return renderGroupsTab();
                    case 'priceAccess': return renderPriceAccessTab();
                    case 'inventory': return renderInventoryTab();
                    case 'pricing': return renderPricingTab();
                    case 'orders': return renderOrdersTab();
                    case 'stockSheets': return renderStockSheetsTab();
                    case 'reports': return renderReportsTab();
                    case 'audit': return renderAuditTab();
                    default: return renderOverviewTab();
                }
            }

            // 1. OVERVIEW TAB
            function renderOverviewTab() {
                const customers = STORE.getCollection('customers');
                const apps = STORE.getCollection('customerApplications');
                const diamonds = STORE.getCollection('diamonds');
                const orders = STORE.getCollection('orders');
                const apts = STORE.getCollection('appointments');
                const inqs = STORE.getCollection('inquiries');
                const cads = STORE.getCollection('customOrders');
                const priceLogs = STORE.getCollection('priceAccessLogs');

                const totalRevenue = orders.reduce((sum, o) => sum + (o.totalAmount || 0), 0);
                const stockValue = diamonds.reduce((sum, d) => sum + (d.totalPrice || 0), 0);

                return `
                    <div class="space-y-6">
                        <!-- Stat Cards Grid -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-xs">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Active Trade Members</div>
                                <div class="text-3xl font-black text-[#0F172A] mt-1 font-heading">${customers.filter(c => c.status === 'active').length}</div>
                                <div class="text-xs text-amber-600 mt-1 font-semibold flex items-center gap-1">
                                    <span>⏳ ${apps.filter(a => a.status === 'Pending Approval').length} Pending Approvals</span>
                                </div>
                            </div>
                            <div class="bg-[#0F172A] text-white p-5 rounded-2xl shadow-md border border-amber-500/30">
                                <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider">Gross Wholesale Revenue</div>
                                <div class="text-3xl font-black text-[#F3E5AB] mt-1 font-heading">$${totalRevenue.toLocaleString()}</div>
                                <div class="text-xs text-slate-300 mt-1 font-medium">${orders.length} Wholesale Orders</div>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-xs">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Inventory Valuation</div>
                                <div class="text-3xl font-black text-emerald-700 mt-1 font-heading">$${stockValue.toLocaleString()}</div>
                                <div class="text-xs text-slate-500 mt-1 font-semibold">${diamonds.length} Certified Loose Stones</div>
                            </div>
                            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-xs">
                                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total Customer Requests</div>
                                <div class="text-3xl font-black text-indigo-900 mt-1 font-heading">${apts.length + inqs.length + cads.length}</div>
                                <div class="text-xs text-slate-500 mt-1 font-medium">${apts.length} Appointments · ${cads.length} CAD Projects</div>
                            </div>
                        </div>

                        <!-- Recent Activity Grid -->
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <!-- Recent Appointments Widget -->
                            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 class="font-bold text-[#0F172A] text-sm flex items-center gap-2">
                                        <span class="text-amber-600">📅</span>
                                        <span>Recent Consultations & Appointments</span>
                                    </h3>
                                    <button onclick="switchTab('appointments')" class="text-xs font-bold text-[#0F172A] hover:text-[#D4AF37] transition hover:underline cursor-pointer">View All &rarr;</button>
                                </div>
                                <div class="space-y-2 text-xs">
                                    ${apts.slice(0, 3).map(a => `
                                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 flex items-center justify-between">
                                            <div>
                                                <div class="font-bold text-slate-900">${a.name} (${a.company})</div>
                                                <div class="text-[11px] text-slate-500">${a.location} · ${a.datetime}</div>
                                            </div>
                                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase ${
                                                a.status === 'Confirmed' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-amber-100 text-amber-800 border border-amber-300'
                                            }">${a.status}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Protected Price Access Logs Widget -->
                            <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-xs space-y-4">
                                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 class="font-bold text-[#0F172A] text-sm flex items-center gap-2">
                                        <span class="text-amber-600">🔑</span>
                                        <span>Protected Trade Price Access Log</span>
                                    </h3>
                                    <button onclick="switchTab('priceAccess')" class="text-xs font-bold text-[#0F172A] hover:text-[#D4AF37] transition hover:underline cursor-pointer">Audit Logs &rarr;</button>
                                </div>
                                <div class="space-y-2 text-xs">
                                    ${priceLogs.slice(0, 3).map(l => `
                                        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200/80 flex items-center justify-between">
                                            <div>
                                                <div class="font-bold text-[#0F172A]">${l.userName} (${l.company})</div>
                                                <div class="text-[11px] text-slate-500">${l.action} ${l.sku !== 'N/A' ? '· Stock #' + l.sku : ''}</div>
                                            </div>
                                            <span class="text-[10px] font-mono text-slate-400">${l.timestamp}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // 2. APPOINTMENTS TAB
            function renderAppointmentsTab() {
                const appointments = STORE.getCollection('appointments');
                const filtered = appointments.filter(a => {
                    const matchesSearch = (a.name + a.company + a.email + a.phone + a.location).toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesStatus = statusFilter === 'All' || a.status === statusFilter;
                    return matchesSearch && matchesStatus;
                });

                return `
                    <div class="space-y-4 text-xs">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <div class="flex items-center gap-3 w-full sm:w-auto">
                                <input type="text" placeholder="Search customer, company, location..." value="${searchQuery}" oninput="searchQuery = this.value; renderApp();" class="px-4 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 outline-none focus:bg-white focus:border-[#0F172A] w-full sm:w-72 font-medium">
                                <select onchange="statusFilter = this.value; renderApp();" class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 font-bold">
                                    <option value="All" ${statusFilter === 'All' ? 'selected' : ''}>All Statuses</option>
                                    <option value="Pending" ${statusFilter === 'Pending' ? 'selected' : ''}>Pending</option>
                                    <option value="Confirmed" ${statusFilter === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                    <option value="Completed" ${statusFilter === 'Completed' ? 'selected' : ''}>Completed</option>
                                    <option value="Cancelled" ${statusFilter === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                            </div>
                            <div class="text-slate-500 font-semibold">Total Appointments: ${filtered.length}</div>
                        </div>

                        <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-[#0F172A] text-white font-bold border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Customer & Company</th>
                                        <th class="p-3">Contact</th>
                                        <th class="p-3">Location / Format</th>
                                        <th class="p-3">Diamond Interest</th>
                                        <th class="p-3">Date & Time</th>
                                        <th class="p-3">Status</th>
                                        <th class="p-3 text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${filtered.map(a => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="p-3">
                                                <div class="font-bold text-slate-900">${a.name}</div>
                                                <div class="text-[11px] text-amber-700 font-medium">${a.company}</div>
                                            </td>
                                            <td class="p-3">
                                                <div class="font-mono text-slate-800">${a.email}</div>
                                                <div class="text-[11px] text-slate-500">${a.phone}</div>
                                            </td>
                                            <td class="p-3 text-slate-700 font-medium">${a.location}</td>
                                            <td class="p-3 text-indigo-900 font-semibold">${a.diamondType || 'General'}</td>
                                            <td class="p-3 font-mono text-slate-600">${a.datetime}</td>
                                            <td class="p-3">
                                                <select onchange="updateAppointmentStatus('${a.id}', this.value)" class="px-2.5 py-1 text-xs rounded-lg font-bold border outline-none ${
                                                    a.status === 'Confirmed' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                                                    a.status === 'Completed' ? 'bg-blue-100 text-blue-800 border-blue-300' :
                                                    a.status === 'Cancelled' ? 'bg-rose-100 text-rose-800 border-rose-300' :
                                                    'bg-amber-100 text-amber-800 border-amber-300'
                                                }">
                                                    <option ${a.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                                    <option ${a.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                                                    <option ${a.status === 'Completed' ? 'selected' : ''}>Completed</option>
                                                    <option ${a.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                                                </select>
                                            </td>
                                            <td class="p-3 text-center">
                                                <button onclick="deleteAppointment('${a.id}')" class="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded-lg transition font-bold cursor-pointer">Delete</button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            // 3. INQUIRIES TAB
            function renderInquiriesTab() {
                const inquiries = STORE.getCollection('inquiries');
                const filtered = inquiries.filter(i => {
                    const matchesSearch = (i.name + i.company + i.email + i.subject + i.message).toLowerCase().includes(searchQuery.toLowerCase());
                    const matchesStatus = statusFilter === 'All' || i.status === statusFilter;
                    return matchesSearch && matchesStatus;
                });

                return `
                    <div class="space-y-4 text-xs">
                        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
                            <input type="text" placeholder="Search inquiry subject, customer, email..." value="${searchQuery}" oninput="searchQuery = this.value; renderApp();" class="px-4 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 outline-none focus:bg-white focus:border-[#0F172A] w-full sm:w-72 font-medium">
                            <select onchange="statusFilter = this.value; renderApp();" class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-300 text-slate-900 font-bold">
                                <option value="All" ${statusFilter === 'All' ? 'selected' : ''}>All Statuses</option>
                                <option value="New" ${statusFilter === 'New' ? 'selected' : ''}>New</option>
                                <option value="In Progress" ${statusFilter === 'In Progress' ? 'selected' : ''}>In Progress</option>
                                <option value="Resolved" ${statusFilter === 'Resolved' ? 'selected' : ''}>Resolved</option>
                            </select>
                        </div>

                        <div class="border border-slate-200 rounded-2xl overflow-hidden bg-white shadow-xs">
                            <table class="w-full text-left border-collapse">
                                <thead class="bg-[#0F172A] text-white font-bold border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">Customer</th>
                                        <th class="p-3">Subject & Type</th>
                                        <th class="p-3">Message Snippet</th>
                                        <th class="p-3">Submitted</th>
                                        <th class="p-3">Status</th>
                                        <th class="p-3 text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${filtered.map(i => `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="p-3">

            window.submitCreateGroupForm = function (e) {
                e.preventDefault();
                const name = document.getElementById('grp-modal-name').value.trim();
                const discount = parseInt(document.getElementById('grp-modal-discount').value, 10) || 0;
                const desc = document.getElementById('grp-modal-desc').value.trim() || 'Custom Created Trade Group';

                if (!name) return;

                const newGroup = {
                    id: 'grp_' + Date.now(),
                    name: name,
                    defaultDiscountPercent: discount,
                    description: desc,
                    memberCount: 0
                };

                STORE.saveRecord('customerGroups', newGroup);
                STORE.logAudit('Created Discount Tier Group', 'admin@meleediamonds.com', `Created Group ${name} (${discount}%)`);
                showToast(`Customer Group "${name}" created successfully!`);
                closeAdminCustomModal();
                renderApp();
            };























            // Init App
            document.addEventListener('DOMContentLoaded', renderApp);
            renderApp();

        })();
    </script>
</body>
</html>
